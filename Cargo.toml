# =============================================================================
#  R E P S   ·   repl-lang
# =============================================================================
[package]
name    = "repl-lang"
version = "1.1.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Read-eval-print loop scaffolding: line editing, session state, and incremental input feed."

# Keywords (5 max)
keywords = ["repl", "interactive", "interpreter", "language", "line-editing"]

# Categories
categories = ["command-line-interface", "development-tools", "compilers"]

# Links
homepage      = "https://github.com/jamesgober/repl-lang"
repository    = "https://github.com/jamesgober/repl-lang"
documentation = "https://docs.rs/repl-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "repl_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# The standard library. Without it the crate is `no_std` and needs only `alloc`.
std = ["lexer-lang/std", "diag-lang/std", "source-lang/std", "unicode-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# `Input::cursor` hands the pipeline a scanner already positioned at the entry's
# global base, so every token span it emits is valid in the session's source map.
lexer-lang = { version = "1", default-features = false }
# `Input::is_incomplete` reads parser diagnostics to tell "ran out of input" from
# "wrong input". Default features (ANSI colour) are left to the application.
diag-lang = { version = "1", default-features = false }
# Committed entries live in a `SourceMap`, one source per entry, so a diagnostic
# from any entry renders against the text the user actually typed.
source-lang = { version = "1", default-features = false }
# Display widths (cursor column, zero-width combining marks) and identifier
# classes (word motion) for the line editor.
unicode-lang = { version = "1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion   = { version = "0.5", features = ["html_reports"] }
proptest    = "1"
# The examples and integration tests drive a real parser through the session.
parser-lang = "1"
# A parser that reports diagnostics relative to the entry text rather than the
# session's global positions; the tests check `Input::is_incomplete` with it
# across several entries (ISSUES M72). 1.0.1 is the first release without a
# `deny(warnings)` that breaks on newer toolchains.
lang-forge  = "1.0.1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
